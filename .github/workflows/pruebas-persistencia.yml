name: Verificacion guardado duradero
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-persistencia
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.11.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Compilar APK de depuracion con el espejo nativo
        run: |
          cd android
          gradle --no-daemon assembleDebug
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador API 33 (guardado duradero tras force-stop)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/e2e-persistencia.sh out/app-debug.apk
        continue-on-error: true
      - name: Publicar evidencias como prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh release delete android-persistencia -y --cleanup-tag || true
          gh release create android-persistencia evidence/* --prerelease --title "Verificacion guardado duradero (persistencia run ${{ github.run_number }})" --notes "Verificacion enfocada del espejo nativo de guardado. Ver veredicto-persistencia.txt. Commit ${{ github.sha }}."
