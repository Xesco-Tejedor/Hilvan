name: Restaurar fuentes Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir y verificar el paquete
        run: |
          cat fuentes.b64.* | base64 -d > /tmp/fuentes.tar.gz
          echo '47b6e0dab05b80637884d9787e60f3885c3205cafc68c339a1dbebe234721ceb  /tmp/fuentes.tar.gz' | sha256sum -c -
      - name: Comprobar que no hay secretos
        run: |
          if tar -tzf /tmp/fuentes.tar.gz | grep -iE 'keystore|local[.]properties|[.]jks'; then
            echo 'El paquete contiene secretos: se aborta'; exit 1
          fi
      - name: Extraer, limpiar partes y commitear
        run: |
          tar -xzf /tmp/fuentes.tar.gz
          rm -f fuentes.b64.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Android: fuentes reproducibles (app, guia de build y pruebas e2e), sin secretos'
          git push
      - name: Arbol resultante
        run: find android -type f | sort
