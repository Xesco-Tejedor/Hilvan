name: Publicar Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decodificar y verificar el artefacto
        run: |
          cat apk.b64.00 apk.b64.01 apk.b64.02 apk.b64.03 apk.b64.04 apk.b64.05 | base64 -d > /tmp/h.tar.gz
          echo "48959d1e211e10eeabf9888c4a17a30af317aab5b4cf525cd6902485a11f34a2  /tmp/h.tar.gz" | sha256sum -c -
          mkdir -p /tmp/h && tar xzf /tmp/h.tar.gz -C /tmp/h
      - name: Commit de las fuentes Android y limpieza del artefacto
        run: |
          cp -r /tmp/h/android/. android/
          rm -f apk.b64.00 apk.b64.01 apk.b64.02 apk.b64.03 apk.b64.04 apk.b64.05
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Icono nuevo de Hilvan y fuentes Android v1.2 (versionCode 3)"
          git push
      - name: Release android-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest /tmp/h/hilvan.apk \
            --title "Hilván para Android" \
            --notes "APK de Hilván v1.2 con el icono nuevo. Se instala encima de la versión anterior conservando los relatos guardados; el teléfono pedirá permitir orígenes desconocidos. Necesita internet; la lectura en voz alta y el dictado usan los servicios de voz del teléfono." \
            --latest
