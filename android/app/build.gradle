plugins { id 'com.android.application' }

def ks = rootProject.file('keystore.properties')
def kp = new Properties()
if (ks.exists()) kp.load(new FileInputStream(ks))

android {
    namespace 'es.xescotejedor.hilvan'
    compileSdk 36
    defaultConfig {
        applicationId 'es.xescotejedor.hilvan'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        release {
            storeFile rootProject.file('hilvan.keystore')
            storePassword kp.getProperty('storePassword','')
            keyAlias 'hilvan'
            keyPassword kp.getProperty('keyPassword','')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file('hilvan.keystore').exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
